name: fossa
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
jobs:
  fossa:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.repository == 'G-Core/gcore-go'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/d7419a0c2ab909c9b48e8bc540033062e3d78761/install-latest.sh | bash -s -- v3.19.0
      - name: Set FOSSA API Key
        run: echo "FOSSA_API_KEY=${{ secrets.FOSSA_PUB_API_KEY }}" >> $GITHUB_ENV
      - name: Run FOSSA Analysis
        run: fossa analyze
      - name: Run FOSSA Test
        run: fossa test
