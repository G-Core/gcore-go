name: CI
on:
  # Fire once per SHA. Pull requests cover branches, push covers `main` (a
  # different SHA). Two triggers for one SHA create duplicate check runs with
  # the same name, and GitHub counts a skipped run as a passing required check.
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  # stlc-config dispatches this for preview branches, which never get a pull
  # request here, so a preview SHA still gets exactly one run
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Run lints
        run: ./scripts/lint

  # The generator only emits this job when the spec has a hosted URL, which stlc
  # does not set. scripts/mock serves the embedded spec, so the job runs without one.
  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
